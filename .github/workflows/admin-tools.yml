name: 🧹 Admin Tools — مدیریت داده‌های کاربران

# ابزار دکمه‌ای برای پاک‌سازی داده‌های کاربران — ARIAMIR
#
# نحوه‌ی استفاده (مهم، ترتیب را رعایت کنید):
#   ۱) اگر اجرای فعالی از «Run Ghayoomi Examer Bot» هست: Actions → روی اجرا → Cancel workflow
#      (این ورک‌فلو خودش هم چک می‌کند و اگر ربات روشن بود، اجازه‌ی ادامه نمی‌دهد)
#   ۲) Actions → «🧹 Admin Tools» → Run workflow → حالت موردنظر را انتخاب کنید:
#        • wipe_users      = حذف همه‌ی کاربران + فعالیت‌ها
#        • delete_one_user = حذف فقط یک کاربر (آیدی عددی را در کادر user_id بزنید)
#        • reset_stats     = فقط صفرکردن آمار (کاربران می‌مانند)
#   ۳) پایان اجرا → ربات را دوباره روشن کنید (Run workflow روی ورک‌فلوی اصلی
#      یا صبر کنید نگهبانِ ۳۰ دقیقه‌ای خودش روشنش کند).
#
# جدول‌های محتوایی (کارت‌ها، آزمون‌ها، سوالات، متن‌ها، همگانی‌ها) هرگز پاک نمی‌شوند.
# نتیجه روی برنچ bot-data ذخیره می‌شود.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "wipe_users = همه‌ی کاربران+فعالیت‌ها | delete_one_user = فقط یک کاربر (user_id لازم) | reset_stats = فقط صفرکردن آمار"
        required: true
        type: choice
        options:
          - wipe_users
          - delete_one_user
          - reset_stats
        default: wipe_users
      user_id:
        description: "آیدی عددی کاربر (فقط در حالت delete_one_user لازم است)"
        required: false
        default: ""

concurrency:
  group: ghayoomi-examer-bot-live
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  admin-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TOOL_ACTION: ${{ inputs.action }}
      TOOL_USER_ID: ${{ inputs.user_id }}

    steps:
      - name: 🛡️ Guard — ربات نباید روشن باشد
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          api() {
            curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" "$@"
          }
          count_status() {
            api "https://api.github.com/repos/$REPO/actions/workflows/run-bot.yml/runs?status=$1&per_page=1" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('total_count',0))"
          }
          ACTIVE=$(count_status in_progress)
          QUEUED=$(count_status queued)
          WAITING=$(count_status waiting)
          REQUESTED=$(count_status requested)
          BUSY=$((ACTIVE + QUEUED + WAITING + REQUESTED))
          if [ "$BUSY" != "0" ]; then
            echo "::error title=ربات روشن/در صف است!::ابتدا Actions → اجرای «Run Ghayoomi Examer Bot» را Cancel کنید، چند ثانیه صبر کنید و دوباره این ابزار را اجرا کنید. (اجرا=$ACTIVE صف=$QUEUED انتظار=$WAITING درخواستی=$REQUESTED)"
            exit 1
          fi
          echo "✅ هیچ اجرای ربات فعال/درصف/درانتظار نیست — امنه، ادامه می‌دهیم."

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🔓 رمزگشایی سورس (src.enc)
        env:
          SRC_KEY: ${{ secrets.SRC_KEY }}
        run: |
          set -e
          if [ -z "$SRC_KEY" ]; then
            echo "::error title=Secret ناقص::سکرت SRC_KEY در تنظیمات ریپو ست نشده است"
            exit 42
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 -in src.enc -pass "pass:$SRC_KEY" | tar -xz
          echo "✅ سورس رمزگشایی شد"
      - name: Restore database from bot-data branch
        run: |
          set -e
          mkdir -p data
          if git ls-remote --exit-code --heads origin bot-data >/dev/null 2>&1; then
            git fetch origin bot-data:bot-data --depth=1
            git checkout bot-data -- data 2>/dev/null || true
            echo "دیتابیس از bot-data بازیابی شد."
            ls -la data || true
          else
            echo "برنچ bot-data وجود ندارد."
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 🧹 اجرای ابزار پاک‌سازی
        run: |
          set -e
          ARGS=(--action "$TOOL_ACTION" --db data/ghayoomi.db)
          if [ -n "$TOOL_USER_ID" ]; then
            ARGS+=(--user-id "$TOOL_USER_ID")
          fi
          python scripts/admin_tools.py "${ARGS[@]}"

      - name: 🛡️ Guard دوم — قبل از ذخیره، دوباره چک
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          api() {
            curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" "$@"
          }
          BUSY=0
          for S in in_progress queued waiting requested; do
            C=$(api "https://api.github.com/repos/$REPO/actions/workflows/run-bot.yml/runs?status=$S&per_page=1" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('total_count',0))")
            BUSY=$((BUSY + C))
          done
          if [ "$BUSY" != "0" ]; then
            echo "::error::در همین لحظه اجرای ربات تازه‌ای شروع/صف گرفته — برای جلوگیری از تداخل، ذخیره انجام نمی‌شود. پاسخ: ابتدا آن اجرا را Cancel کنید و دوباره این ابزار را اجرا کنید."
            exit 1
          fi
          echo "✅ همچنان امن است (هیچ اجرای ربات در هیچ وضعیتی نیست)."

      - name: 💾 ذخیره‌ی دیتابیس پاک‌سازی‌شده روی bot-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WORK=$(mktemp -d)
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git clone --branch bot-data --depth 1 "$REPO_URL" "$WORK"
          rm -rf "$WORK/data"
          mkdir -p "$WORK/data"
          cp -a data/. "$WORK/data/"
          rm -f "$WORK/.env" "$WORK/data/.env" 2>/dev/null || true

          cat > "$WORK/.gitignore" <<'EOF'
          .env
          __pycache__/
          EOF

          cd "$WORK"
          git add -A
          if git diff --cached --quiet; then
            echo "تغییری برای ذخیره نبود."
          else
            git commit -m "🧹 Admin tools: ${TOOL_ACTION} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:bot-data
            echo "✅ دیتابیس پاک‌سازی‌شده روی برنچ bot-data ذخیره شد."
          fi

      - name: 📢 خلاصه
        if: success()
        run: |
          echo "🧹 عملیات «${TOOL_ACTION}» با موفقیت انجام و ذخیره شد."
          echo "ℹ️ حالا می‌توانی ربات را دوباره روشن کنی (اجرا دستی یا صبر تا تیک نگهبان هر ۳۰ دقیقه — دقیقه‌های ۷ و ۳۷ ساعت)."
