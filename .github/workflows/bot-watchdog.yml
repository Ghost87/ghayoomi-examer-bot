name: Bot Watchdog (auto-restart)

# 🐕 نگهبان ربات — هر ۳۰ دقیقه
# اگر هیچ اجرای فعال یا درصف از run-bot.yml وجود نداشته باشد،
# خودکار یک اجرای تازه می‌سازد. نتیجه: اگر ربات کرش کند، گیت‌هاب خطا دهد
# یا زمان‌بند دیر بجنبد، حداکثر تا ~۳۰ دقیقه بعد ربات برمی‌گردد.

on:
  schedule:
    # دقیقه‌های ۷ و ۳۷ — میانِ دوری زمان‌بند اصلی (۲۳ */۶) تا پوشش دقیق‌تر
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🐕 بررسی وضعیت و راه‌اندازی مجدد در صورت نیاز
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          api() {
            curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" "$@"
          }

          wf_count() {
            # $1 = فایل ورک‌فلو، $2 = وضعیت
            api "https://api.github.com/repos/$REPO/actions/workflows/$1/runs?status=$2&per_page=1" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('total_count',0))"
          }

          ACTIVE=0; QUEUED=0
          for S in in_progress queued waiting requested; do
            C=$(wf_count run-bot.yml "$S")
            case "$S" in
              in_progress) ACTIVE=$C ;;
              *) QUEUED=$((QUEUED + C)) ;;
            esac
          done

          # اگر ابزار پاک‌سازی (🧹 Admin Tools) مشغول است، نگهبان دست نگه می‌دارد
          ADMIN_BUSY=0
          for S in in_progress queued waiting requested; do
            ADMIN_BUSY=$((ADMIN_BUSY + $(wf_count admin-tools.yml "$S")))
          done

          echo "bot: in_progress=$ACTIVE queued_or_waiting=$QUEUED | admin_tools busy=$ADMIN_BUSY"

          if [ "$ADMIN_BUSY" != "0" ]; then
            echo "🧹 ابزار مدیریتی در حال کار است — نگهبان این دور کاری نمی‌کند (ضدتداخل)."
            exit 0
          fi

          if [ "$ACTIVE" = "0" ] && [ "$QUEUED" = "0" ]; then
            echo "⛔ هیچ اجرای فعالی نیست — ساخت اجرای تازه..."
            api -X POST \
              "https://api.github.com/repos/$REPO/actions/workflows/run-bot.yml/dispatches" \
              -d '{"ref":"main"}'
            echo "✅ ربات دوباره روشن شد."
          else
            echo "✅ ربات روشن یا در صف است — مداخله لازم نیست."
          fi
